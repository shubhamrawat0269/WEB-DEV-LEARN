<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>String Transform</title>
  <script src="index.js" defer></script>
</head>

<body>
  <input type="text" id="input-box" />

  <div>
    <p>Lowercase : <span id="lowercase"></span></p>
    <p>Uppercase : <span id="uppercase"></span></p>
    <p>Camelcase : <span id="camelcase"></span></p>
    <p>Pascalcase : <span id="pascalcase"></span></p>
    <p>Snake case : <span id="snakecase"></span></p>
    <p>kebab case : <span id="kebabcase"></span></p>
    <p>trim : <span id="trim"></span></p>
  </div>
</body>

</html>
