<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter App</title>
  <link rel="stylesheet" href="style.css">
  <script src="index.js" defer></script>
</head>

<body>
  <h1 id="counter"></h1>

  <button id="button-decrement" onclick="handleDecrement()">-</button>
  <button id="button-increment" onclick="handleIncrement()">+</button>

  <div>
    <p>increment/decrement by</p>
    <input type="number" value="1" id="input-box" name="input-box" />
  </div>

  <button id="button-reset" onclick="handleReset()">Reset</button>
</body>

</html>
